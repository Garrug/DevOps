
name: Extract and Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  # Job 1 : Extract HTML from Docker image
  extract-html:
    name: Extract HTML from Docker
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Download Docker image
      - name: Pull Docker image
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/devops-helloworld:latest

      # Create temporary container
      - name: Create temporary container
        run: |
          docker create --name html-container \
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-helloworld:latest

      # Extract HTML file
      - name: Extract HTML file
        run: |
          mkdir public
          docker cp html-container:/usr/share/nginx/html/index.html public/index.html

      # Remove temporary container
      - name: Remove temporary container
        run: |
          docker rm html-container

      # Upload extracted HTML as artifact
      - name: Upload HTML artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

  # Job 2 : Deploy to GitHub Pages
  deploy:
    name: Deploy to GitHub Pages
    needs: extract-html
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Configure GitHub Pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # Deploy website
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
