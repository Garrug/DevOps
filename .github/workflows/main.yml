name: Hello World

on:
  push:

jobs:
  nom:
    runs-on: ubuntu-latest
    steps:
      - name: Afficher le nom
        run: echo "Nom : $NOM"
        env:
          NOM: ${{ vars.NOM }}

  prenom:
    runs-on: ubuntu-latest
    steps:
      - name: Afficher le prénom
        run: echo "Prénom : $PRENOM"
        env:
          PRENOM: ${{ vars.PRENOM }}

  email:
    runs-on: ubuntu-latest
    steps:
      - name: Afficher l'email
        run: echo "Email : $EMAIL"
        env:
          EMAIL: ${{ vars.EMAIL }}