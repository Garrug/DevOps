name: Hello World

on:
  push:

jobs:
  nom:
    runs-on: ubuntu-latest
    env:
      NOM: ${{ vars.NOM }}
    steps:
      - name: Afficher le nom
        run: echo "Nom : $NOM"

  prenom:
    runs-on: ubuntu-latest
    env:
      PRENOM: ${{ vars.PRENOM }}
    steps:
      - name: Afficher le prénom
        run: echo "Prénom : $PRENOM"

  email:
    runs-on: ubuntu-latest
    env:
      EMAIL: ${{ vars.EMAIL }}
    steps:
      - name: Afficher l'email
        run: echo "Email : $EMAIL"